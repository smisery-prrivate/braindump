plugins {
    id 'com.android.application'
}

android {
    namespace 'app.zeitbrowser'
    compileSdk 34

    defaultConfig {
        applicationId 'app.zeitbrowser'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Fester Schluessel im Repo, damit Updates ueber die alte Version installiert werden koennen.
    signingConfigs {
        release {
            storeFile file('zeitbrowser.keystore')
            storePassword 'zeitbrowser'
            keyAlias 'zeitbrowser'
            keyPassword 'zeitbrowser'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
