name: ZeitBrowser APK

on:
  push:
    paths:
      - 'zeitbrowser/**'
      - '.github/workflows/zeitbrowser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeitbrowser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk ZeitBrowser.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZeitBrowser
          path: zeitbrowser/ZeitBrowser.apk
      - name: Als Release zum Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zeitbrowser-latest
          name: ZeitBrowser (neueste Version)
          target_commitish: ${{ github.sha }}
          files: zeitbrowser/ZeitBrowser.apk
          body: "ZeitBrowser.apk auf dem Handy herunterladen und installieren."
